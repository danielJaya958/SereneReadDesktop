name: Release

# Push a tag such as v1.0.1 to build the Windows installer and publish it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # MSI versions must be MAJOR.MINOR.BUILD, with a major version of at least 1.
          if [[ ! "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :shared:jvmTest --console=plain

      - name: Build installer
        run: ./gradlew :desktopApp:packageMsi -PappVersion=${{ steps.version.outputs.value }} --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            desktopApp/build/compose/binaries/main/msi/SereneRead-${{ steps.version.outputs.value }}.msi \
            --title "SereneRead ${{ steps.version.outputs.value }}" \
            --generate-notes
